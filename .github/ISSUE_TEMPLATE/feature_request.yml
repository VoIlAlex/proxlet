name: Feature request
description: Suggest an idea or a new integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like proxlet to do?
      description: Example commands and output help a lot.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
