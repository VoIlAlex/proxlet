name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  systemd:
    name: systemd service (end to end)
    # GitHub's Ubuntu runners boot with systemd, so this exercises the real flow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: start, add, request, stop
        run: |
          set -euxo pipefail
          P="$PWD/target/debug/proxlet"
          mkdir -p "$HOME/site"
          echo "hello from proxlet" > "$HOME/site/index.html"

          sudo "$P" start
          "$P" status | grep -q "systemd service"
          # The service runs as the user who ran sudo, not as root.
          test "$(systemctl show proxlet.service --property=User --value)" = "$USER"
          systemctl is-enabled proxlet.service

          # Rules apply live, without sudo.
          "$P" add /site "$HOME/site"
          curl -fsS http://127.0.0.1/site/ | grep -q "hello from proxlet"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/nope)" = 404
          sudo "$P" start | grep -q "already running"

          sudo "$P" stop
          if "$P" status; then echo "still running after stop"; exit 1; fi
          if systemctl is-enabled proxlet.service; then echo "still enabled after stop"; exit 1; fi
          if curl -fsS http://127.0.0.1/site/; then echo "still serving after stop"; exit 1; fi
          "$P" ls | grep -q "^/site"
          sudo "$P" stop | grep -q "not running"
      - name: logs from the service
        run: |
          set -euxo pipefail
          P="$PWD/target/debug/proxlet"
          sudo "$P" start
          curl -fsS http://127.0.0.1/site/ >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/nope)" = 404

          # Following: the history, then a new request, without its query.
          sleep 1
          before=$("$P" logs /site --all --json | wc -l)
          timeout 4 "$P" logs /site --json > /tmp/follow.txt &
          F=$!
          sleep 1.5
          curl -fsS "http://127.0.0.1/site/?secret=1" >/dev/null
          wait $F || true
          cat /tmp/follow.txt
          test "$(wc -l < /tmp/follow.txt)" -eq $((before + 1))
          tail -n 1 /tmp/follow.txt | grep -q '"path":"/site/"'
          if grep -q secret /tmp/follow.txt; then echo "query recorded"; exit 1; fi

          "$P" logs --all | tee /tmp/logs.txt
          grep -q " 200  GET .*127.0.0.1/site/" /tmp/logs.txt
          grep -q " 404  GET .*127.0.0.1/nope" /tmp/logs.txt
          grep -q "INFO .*listening on http://" /tmp/logs.txt
          "$P" logs /site --all --json | python3 -m json.tool --json-lines
          test "$(stat -c %a "$HOME/.local/state/proxlet/logs")" = 700
          test "$(stat -c %U "$HOME/.local/state/proxlet/logs/proxlet.log")" = "$USER"

          # Still readable once the service has stopped.
          sudo "$P" stop
          "$P" logs --all | grep -q "stopped"
      - name: monitor from the service
        run: |
          set -euxo pipefail
          P="$PWD/target/debug/proxlet"
          sudo "$P" start
          for i in 1 2 3; do curl -fsS http://127.0.0.1/site/ >/dev/null; done
          curl -s -o /dev/null http://127.0.0.1/nope || true

          "$P" monitor --once | tee /tmp/monitor.txt
          head -n 1 /tmp/monitor.txt | grep -q "^RULE "
          awk '$1 == "/site" && $4 >= 3 { found = 1 } END { exit !found }' /tmp/monitor.txt
          awk '$1 == "(no" && $5 >= 1 { found = 1 } END { exit !found }' /tmp/monitor.txt
          # Piped without --once: the same plain table, no escape sequences.
          "$P" monitor | tee /tmp/monitor-piped.txt
          if grep -q $'\x1b' /tmp/monitor-piped.txt; then echo "escape sequences"; exit 1; fi

          sudo "$P" stop
          if "$P" monitor 2>/tmp/monitor-err.txt; then echo "monitor without a server"; exit 1; fi
          grep -q "not running" /tmp/monitor-err.txt
      - name: a taken port means waiting, then taking it
        run: |
          set -euxo pipefail
          P="$PWD/target/debug/proxlet"
          sudo python3 -m http.server 80 --bind 0.0.0.0 >/dev/null 2>&1 &
          sleep 1
          out=$(sudo "$P" start 2>&1)
          echo "$out"
          echo "$out" | grep -q "waiting for port 80"
          "$P" status | grep -q "waiting for port 80"
          sudo pkill -f "http.server 80"
          for i in $(seq 50); do "$P" status | grep -q "mode    standalone" && break; sleep 0.2; done
          "$P" status | grep -q "mode    standalone"
          curl -fsS http://127.0.0.1/site/ | grep -q "hello from proxlet"
          sudo "$P" stop
      - name: a failed start is explained
        run: |
          set -euxo pipefail
          P="$PWD/target/debug/proxlet"
          CONFIG="$HOME/.config/proxlet/proxlet.toml"
          cp "$CONFIG" /tmp/proxlet.toml.bak
          printf 'listen = = broken\n' >> "$CONFIG"
          if out=$(sudo "$P" start 2>&1); then echo "start succeeded with a broken config"; exit 1; fi
          echo "$out"
          echo "$out" | grep -q "proxlet.toml"
          if systemctl is-enabled proxlet.service; then echo "left enabled after failure"; exit 1; fi
          cp /tmp/proxlet.toml.bak "$CONFIG"
      - name: service log
        if: failure()
        run: sudo journalctl -u proxlet.service --no-pager -n 100

  nginx:
    name: nginx attach (end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: install nginx, which takes port 80
        run: |
          set -euxo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q nginx
          # The runner image ships nginx with its service disabled.
          sudo systemctl enable --now nginx
          systemctl is-active nginx
          # nginx's own site, over HTTP and HTTPS (self-signed).
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=site.test \
            -keyout /etc/nginx/site.key -out /etc/nginx/site.crt
          printf 'server {\n    listen 80;\n    server_name site.test;\n    listen 443 ssl;\n    ssl_certificate /etc/nginx/site.crt;\n    ssl_certificate_key /etc/nginx/site.key;\n    return 200 "from nginx\\n";\n}\n' \
            | sudo tee /etc/nginx/sites-enabled/site
          sudo nginx -t
          sudo systemctl reload nginx
          sudo cp -a /etc/nginx /tmp/nginx-before
      - name: start attaches behind nginx
        run: |
          set -euxo pipefail
          P="$PWD/target/debug/proxlet"
          mkdir -p "$HOME/site"
          echo "hello from proxlet" > "$HOME/site/index.html"
          "$P" add /site "$HOME/site"
          "$P" add /ws 9001
          sudo "$P" start --yes
          for i in $(seq 50); do "$P" status | grep -q "attached (nginx)" && break; sleep 0.2; done
          "$P" status | tee /dev/stderr | grep -q "mode    attached (nginx)"
          test -f /etc/nginx/conf.d/proxlet.conf
          test -f /etc/systemd/system/nginx.service.d/proxlet.conf
          # Only active lines: the file also has commented-out `# listen 443 ssl default_server;`.
          if grep -Eq '^[[:space:]]*listen[^#]*default_server' /etc/nginx/sites-available/default; then exit 1; fi
          # Unclaimed host: proxlet. Claimed host: nginx.
          curl -fsS -H 'Host: other.test' http://127.0.0.1/site/ | grep -q "hello from proxlet"
          curl -fsS -H 'Host: site.test' http://127.0.0.1/ | grep -q "from nginx"
          curl -s -H 'Host: other.test' http://127.0.0.1/nope | grep -q "proxlet"
      - name: websocket through nginx
        run: |
          set -euxo pipefail
          python3 .github/scripts/ws_echo.py serve 9001 &
          sleep 1
          python3 .github/scripts/ws_echo.py send 127.0.0.1 80 other.test /ws hello-ws | grep -qx hello-ws
      - name: https through nginx
        run: |
          set -euxo pipefail
          P="$PWD/target/debug/proxlet"
          "$P" status | tee /dev/stderr | grep -q "https   attached (nginx)"
          grep -q "listen 443 ssl default_server;" /etc/nginx/conf.d/proxlet.conf
          test -d /var/lib/proxlet/nginx-certs
          .github/scripts/pebble.sh 80
          echo "127.0.0.1 app.example.org" | sudo tee -a /etc/hosts
          "$P" config cert.server https://localhost:14000/dir
          # The service must trust Pebble's own HTTPS.
          sudo mkdir -p /etc/systemd/system/proxlet.service.d
          printf '[Service]\nEnvironment=PROXLET_ACME_ROOTS=/tmp/pebble/minica.pem\n' \
            | sudo tee /etc/systemd/system/proxlet.service.d/ci.conf
          sudo systemctl daemon-reload
          sudo systemctl restart proxlet
          for i in $(seq 50); do "$P" status | grep -q "https   attached (nginx)" && break; sleep 0.2; done
          # Pebble validates through nginx on port 80; no nginx reload follows.
          "$P" cert app.example.org --yes | tee /dev/stderr | grep -q "✓ Certificate for app.example.org"
          sudo test -f /var/lib/proxlet/nginx-certs/app.example.org.pem
          curl -fsS --cacert /tmp/pebble/root.pem --resolve app.example.org:443:127.0.0.1 \
            https://app.example.org/site/ | grep -q "hello from proxlet"
          # nginx's own HTTPS site keeps its own certificate.
          curl -fsSk --resolve site.test:443:127.0.0.1 https://site.test/ | grep -q "from nginx"
          curl -sS -o /dev/null -w '%{http_code} %{redirect_url}\n' -H 'Host: app.example.org' \
            http://127.0.0.1/site/ | tee /dev/stderr | grep -qx "308 https://app.example.org/site/"
      - name: nginx stops and starts as a service
        run: |
          set -euxo pipefail
          P="$PWD/target/debug/proxlet"
          sudo systemctl stop nginx
          for i in $(seq 25); do "$P" status | grep -q "mode    standalone" && break; sleep 0.2; done
          "$P" status | grep -q "mode    standalone"
          curl -fsS http://127.0.0.1/site/ | grep -q "hello from proxlet"
          # proxlet serves HTTPS itself once nginx lets go of port 443.
          for i in $(seq 25); do "$P" status | grep -q "https   https://" && break; sleep 0.2; done
          curl -fsS --cacert /tmp/pebble/root.pem --resolve app.example.org:443:127.0.0.1 \
            https://app.example.org/site/ | grep -q "hello from proxlet"
          sudo systemctl start nginx
          systemctl is-active nginx
          for i in $(seq 50); do "$P" status | grep -q "attached (nginx)" && break; sleep 0.2; done
          "$P" status | grep -q "mode    attached (nginx)"
          curl -fsS -H 'Host: other.test' http://127.0.0.1/site/ | grep -q "hello from proxlet"
      - name: nginx started by hand
        run: |
          set -euxo pipefail
          P="$PWD/target/debug/proxlet"
          sudo systemctl stop nginx
          for i in $(seq 25); do "$P" status | grep -q "mode    standalone" && break; sleep 0.2; done
          sudo nginx
          for i in $(seq 50); do "$P" status | grep -q "attached (nginx)" && break; sleep 0.2; done
          "$P" status | grep -q "mode    attached (nginx)"
          curl -fsS -H 'Host: other.test' http://127.0.0.1/site/ | grep -q "hello from proxlet"
          sudo nginx -s quit
          for i in $(seq 50); do "$P" status | grep -q "mode    standalone" && break; sleep 0.2; done
          sudo systemctl start nginx
      - name: a host nginx serves needs confirmation
        run: |
          set -euxo pipefail
          P="$PWD/target/debug/proxlet"
          if "$P" add site.test 3000 < /dev/null; then echo "added without confirmation"; exit 1; fi
          "$P" add site.test 3000 --yes
          "$P" ls | grep "^site.test" | grep -q "served by nginx (/etc/nginx/sites-enabled/site:3)"
          "$P" rm site.test
      - name: stop restores nginx exactly
        run: |
          set -euxo pipefail
          P="$PWD/target/debug/proxlet"
          sudo "$P" stop
          sudo diff -r /tmp/nginx-before /etc/nginx
          test ! -e /etc/systemd/system/nginx.service.d/proxlet.conf
          test ! -e /var/lib/proxlet/nginx-certs
          sudo nginx -t
          if curl -s -H 'Host: other.test' http://127.0.0.1/ | grep -q proxlet; then exit 1; fi
      - name: logs
        if: failure()
        run: |
          sudo journalctl -u proxlet.service -u nginx.service --no-pager -n 200
          sudo tail -n 50 /var/log/nginx/error.log

  acme:
    name: certificates with Pebble (end to end)
    runs-on: ubuntu-latest
    env:
      PROXLET_ACME_ROOTS: /tmp/pebble/minica.pem
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: start Pebble
        run: |
          .github/scripts/pebble.sh 5002
          echo "127.0.0.1 app.example.org" | sudo tee -a /etc/hosts
      - name: the ACME client against Pebble
        env:
          PEBBLE_DIRECTORY: https://localhost:14000/dir
          PEBBLE_HTTP_PORT: "5002"
        run: cargo test -p proxlet-cert --locked pebble -- --nocapture
      - name: issue, serve, redirect
        run: |
          set -euxo pipefail
          P="$PWD/target/debug/proxlet"
          mkdir -p "$HOME/site"
          echo "hello over https" > "$HOME/site/index.html"
          "$P" config listen.http_port 5002
          "$P" config listen.https_port 5443
          "$P" config cert.server https://localhost:14000/dir
          "$P" add app.example.org "$HOME/site"
          # A host rule beats hostless ones, so the WebSocket route names the host too.
          "$P" add app.example.org/ws 9001
          "$P" run > /tmp/proxlet.log 2>&1 &
          for i in $(seq 50); do "$P" status > /dev/null && break; sleep 0.2; done
          "$P" cert app.example.org --yes | tee /dev/stderr | grep -q "✓ Certificate for app.example.org, valid until"
          "$P" status | tee /dev/stderr | grep -q "https   https://0.0.0.0:5443 (1 certificate)"
          curl -fsS --cacert /tmp/pebble/root.pem --resolve app.example.org:5443:127.0.0.1 \
            https://app.example.org:5443/ | grep -q "hello over https"
          curl -sS -o /dev/null -w '%{http_code} %{redirect_url}\n' -H 'Host: app.example.org' \
            'http://127.0.0.1:5002/a?b=1' | tee /dev/stderr | grep -qx "308 https://app.example.org:5443/a?b=1"
      - name: websocket over https
        run: |
          set -euxo pipefail
          python3 .github/scripts/ws_echo.py serve 9001 &
          sleep 1
          python3 .github/scripts/ws_echo.py send 127.0.0.1 5443 app.example.org /ws hello-wss /tmp/pebble/root.pem \
            | grep -qx hello-wss
      - name: renew, list, remove
        run: |
          set -euxo pipefail
          P="$PWD/target/debug/proxlet"
          "$P" cert renew app.example.org | grep -q "Renewed the certificate for app.example.org"
          "$P" cert ls | tee /dev/stderr | grep -q "^app.example.org"$'\t'
          "$P" cert rm app.example.org
          if curl -fsS --cacert /tmp/pebble/root.pem --resolve app.example.org:5443:127.0.0.1 \
            https://app.example.org:5443/; then echo "still served after rm"; exit 1; fi
          "$P" stop
      - name: logs
        if: failure()
        run: |
          cat /tmp/proxlet.log || true
          tail -n 100 /tmp/pebble/pebble.log || true

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version is passed as an input, not as the action ref, so Dependabot
      # does not mistake the MSRV for an outdated action version.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
