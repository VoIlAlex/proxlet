[package]
name = "proxlet-cert"
description = "TLS certificates for proxlet: ACME issuance, storage and renewal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
## A local fake CA for tests in this and other crates.
test-support = []

[dependencies]
bytes = "1.12.2"
http-body-util = "0.1.5"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring"] }
proxlet-core = { version = "0.1.0", path = "../proxlet-core" }
http = "1.5.0"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["sync", "time", "macros"] }
webpki-roots = "1"
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
