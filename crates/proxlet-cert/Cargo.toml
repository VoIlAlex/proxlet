[package]
name = "proxlet-cert"
description = "TLS certificates for proxlet: ACME issuance, storage and renewal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
## A local fake CA for tests in this and other crates.
test-support = []

[dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
time = { version = "0.3", default-features = false, features = ["std"] }
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"
