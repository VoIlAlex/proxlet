[package]
name = "proxlet"
description = "A tiny, fast reverse proxy and HTTP server that runs standalone or attaches to nginx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.9", features = ["derive"] }
clap_complete = { version = "4.6.12", features = ["unstable-dynamic"] }
nix = { version = "0.32.0", default-features = false, features = ["fs", "user", "signal"] }
proxlet-cert = { version = "0.1.0", path = "../proxlet-cert", features = ["test-support"] }
proxlet-core = { version = "0.1.0", path = "../proxlet-core" }
proxlet-front = { version = "0.1.0", path = "../proxlet-front" }
proxlet-server = { version = "0.1.0", path = "../proxlet-server" }
proxlet-service = { version = "0.1.0", path = "../proxlet-service" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["local-offset"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "signal", "macros", "io-util", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }

[lints]
workspace = true

[dev-dependencies]
nix = { version = "0.32.0", default-features = false, features = ["signal"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.27.0"
